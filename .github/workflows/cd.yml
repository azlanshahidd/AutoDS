# ──────────────────────────────────────────────────────────────────────────────
# CD — deploy pipeline.
#
# Staging:    auto-deploy on every push/merge to master.
# Production: requires a manual "Promote to production" approval gate, then
#             only deploys when a semver tag (v*.*.*) is pushed — or via
#             manual workflow_dispatch.
#
# How Railway deployment works here:
#   Railway's GitHub integration watches a branch directly and redeploys on
#   every push. This workflow therefore only needs to trigger a Railway
#   redeploy via their REST API (using a deploy hook URL stored as a secret).
#
#   Required GitHub secrets (set in repo Settings → Secrets → Actions):
#     RAILWAY_STAGING_DEPLOY_HOOK    — Railway deploy hook URL for staging service
#     RAILWAY_PROD_DEPLOY_HOOK       — Railway deploy hook URL for production service
#
#   To get a Railway deploy hook URL:
#     Railway dashboard → your service → Settings → Deploy → Deploy Hooks → Add Hook
#
# Production approval gate:
#   Uses a GitHub "Environment" named "production" with a required reviewer.
#   Create it at: repo Settings → Environments → New environment → "production"
#   Add yourself (or a team) as a required reviewer.
#   Deployments to production then pause and wait for approval in the Actions UI.
# ──────────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches:
      - master               # staging auto-deploy
    tags:
      - "v*.*.*"             # production deploy on semver tag
  workflow_dispatch:         # manual trigger for both environments
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight deploy

jobs:
  # ── Guard: CI must pass before any deploy ────────────────────────────────────
  # Re-runs typecheck + tests to ensure the exact commit being deployed is
  # clean, even if a direct push bypassed a PR.
  ci-gate:
    name: CI gate (typecheck + tests)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DASHBOARD_AUTH_TOKEN: ci-test-token-not-real
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm run typecheck
      - run: npm run test

  # ── Staging deploy (automatic on master push) ─────────────────────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: ci-gate
    # Run on master push OR manual dispatch targeting staging
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    environment:
      name: staging
      url: https://your-staging-service.railway.app   # update with your real URL

    steps:
      - name: Trigger staging redeploy
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "⚠️  RAILWAY_STAGING_DEPLOY_HOOK secret not set — skipping deploy trigger."
            exit 0
          fi
          echo "Deploying commit ${{ github.sha }} to staging..."
          curl -s -X POST "$DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
          echo "Staging deploy triggered."
        env:
          DEPLOY_HOOK: ${{ secrets.RAILWAY_STAGING_DEPLOY_HOOK }}

  # ── Production deploy (manual approval required) ──────────────────────────
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: ci-gate
    # Run on semver tag push OR manual dispatch targeting production
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')

    # The "production" GitHub environment has required reviewers configured.
    # The job pauses here until an approved reviewer clicks "Approve" in the
    # Actions UI — no deploy proceeds without explicit human sign-off.
    environment:
      name: production
      url: https://your-production-service.railway.app   # update with your real URL

    steps:
      - name: Confirm deployment target
        run: |
          echo "Deploying ${{ github.ref }} to PRODUCTION."
          echo "Approved by: ${{ github.actor }}"

      - name: Trigger production redeploy
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "⚠️  RAILWAY_PROD_DEPLOY_HOOK secret not set — skipping deploy trigger."
            exit 0
          fi
          curl -s -X POST "$DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
          echo "Production deploy triggered."
        env:
          DEPLOY_HOOK: ${{ secrets.RAILWAY_PROD_DEPLOY_HOOK }}
